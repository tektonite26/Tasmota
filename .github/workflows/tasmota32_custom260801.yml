name: Build Tasmota ESP32 Factory

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone Tasmota 15.5
        run: |
          git clone --depth 1 --branch v15.5.0 https://github.com/arendst/Tasmota.git source

      - name: Copy override file
        run: |
          cp ./tasmota/user_config_override.h source/tasmota/user_config_override.h

      - name: Inject config override flag
        run: |
          if grep -q "build_flags" source/platformio.ini; then
            sed -i 's/^build_flags[[:space:]]*=.*/& -DUSE_CONFIG_OVERRIDE/' source/platformio.ini
          else
            echo "build_flags = -DUSE_CONFIG_OVERRIDE" >> source/platformio.ini
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Tasmota ESP32
        working-directory: source
        run: |
          pio run -e tasmota32

      - name: Show build files
        working-directory: source
        run: |
          find build_output -type f | sort

      - name: Upload factory binary
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-factory
          path: source/build_output/**/*.factory.bin
          
