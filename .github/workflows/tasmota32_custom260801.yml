name: Build Tasmota ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Tasmota
        run: |
          git clone --depth 1 --branch v15.5.0 https://github.com/arendst/Tasmota.git source

      - name: Copy configuration
        run: |
          cp tasmota/user_config_override.h source/tasmota/

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build
        working-directory: source
        run: |
          pio run -e tasmota32

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-custom
          path: source/build_output/firmware/tasmota32.bin
