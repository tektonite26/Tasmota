name: Build Tasmota ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Tasmota 15.5
        run: |
          git clone --depth 1 --branch v15.5.0 https://github.com/arendst/Tasmota.git source

      - name: Copy configuration
        run: |
          cp tasmota/user_config_override.h source/tasmota/

      - name: Install tools
        run: |
          pip install platformio esptool

      - name: Build Tasmota ESP32
        working-directory: source
        run: |
          pio run -e tasmota32

      - name: Show build output
        working-directory: source
        run: |
          echo "===== BUILD FILES ====="
          ls -lah .pio/build/tasmota32/
          echo "======================="

      - name: Create factory image
        working-directory: source
        run: |
          esptool merge-bin \
          --chip esp32
            -o tasmota32.factory.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 .pio/build/tasmota32/bootloader.bin \
            0x8000 .pio/build/tasmota32/partitions.bin \
            0x10000 .pio/build/tasmota32/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-factory
          path: source/tasmota32.factory.bin
